# Auto-deploy to Netlify on every push.
#
# Needs ONE repository secret to activate:
#   NETLIFY_AUTH_TOKEN — create it at
#   https://app.netlify.com/user/applications#personal-access-tokens
#   then add it at
#   https://github.com/achente23/mimicreates/settings/secrets/actions
#
# Until the secret exists, the workflow runs but skips deploying
# (green check, no failure).
#
# Note: if the repo is instead linked to Netlify from the Netlify
# dashboard (Project configuration → Build & deploy → Link repository),
# Netlify builds on push by itself and this workflow becomes
# redundant — delete this file in that case so pushes don't deploy twice.

name: Deploy to Netlify

on:
  push:
    branches:
      - claude/mimic-creates-id-website-8ivzsp
      - main
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 682b25f7-15cf-4094-b033-494735f29951
    steps:
      - name: Check deploy token
        id: check
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NETLIFY_AUTH_TOKEN secret is not set — skipping deploy. See .github/workflows/deploy.yml for setup."
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.enabled == 'true'
        run: npm run build

      - name: Deploy to Netlify
        if: steps.check.outputs.enabled == 'true'
        run: npx --yes netlify-cli@23 deploy --prod --dir dist --site "$NETLIFY_SITE_ID" --message "GitHub Actions: ${{ github.sha }}"
